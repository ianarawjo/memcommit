name: Documentation integrity

on:
  pull_request:
  push:

jobs:
  operation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify operation evidence ledger
        run: python scripts/verify_operation_evidence.py --check
      - name: Run ledger regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_operation_evidence.py
