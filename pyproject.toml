[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memcommit"
version = "0.0.1"
description = "A git-like memory store CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.scripts]
mem = "memcommit.cli:app"

[tool.setuptools]
packages = ["memcommit", "memcommit.commands"]
