[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memcommit"
version = "0.0.1"
description = "A git-like memory store CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "prompt-toolkit>=3.0.52,<4",
  "Pillow>=10.0",
]

[project.scripts]
mem = "memcommit.cli:app"
mem-mcp = "memcommit.interfaces.mcp.server:main"

[tool.setuptools.packages.find]
include = ["memcommit*"]

[tool.setuptools.package-data]
"memcommit" = ["assets/*.ttf", "assets/*-OFL.txt"]
"memcommit.eval" = ["fixtures/*.json"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
