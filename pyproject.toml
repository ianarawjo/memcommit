[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memcommit"
version = "0.0.1"
description = "A git-like memory store CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # CLI adapters still rely on Typer's Click-backed context and test-runner APIs.
  "click>=8.1,<8.2",
  "typer>=0.12,<0.13",
  "rich>=13.0",
  "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
mem = "memcommit.adapters.console.entrypoint:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["memcommit*"]

[tool.setuptools.package-data]
"memcommit.application.capabilities.memory_issue_analysis" = ["fixtures/*.json"]
"memcommit.application.capabilities.semantic" = ["fixtures/*.json"]
"memcommit.application.operations.atomize" = ["fixtures/*.json"]
"memcommit.application.operations.compare" = ["fixtures/*.json"]
"memcommit.application.operations.rationale" = ["fixtures/*.json"]
"memcommit.application.operations.resolve" = ["fixtures/*.json"]
"memcommit.study_scenarios.legacy" = ["data/en/*", "data/ko/*", "data/native/**/*.json", "data/native/metadata/*.tsv"]
"memcommit.study_scenarios.coffee" = ["data/composition.json", "data/**/context.json"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Execution captures are immutable research artifacts, not maintained source.
extend-exclude = ["agent-records/outputs"]
