[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memcommit"
version = "0.0.1"
description = "A git-like memory store CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "prompt-toolkit>=3.0.52,<4",
  "Pillow>=10.0",
]

[project.scripts]
mem = "memcommit.cli:app"

[tool.setuptools]
packages = [
  "memcommit",
  "memcommit.commands",
  "memcommit.semantic",
  "memcommit.source_projection",
  "memcommit.eval",
]

[tool.setuptools.package-data]
"memcommit" = ["assets/*.ttf", "assets/*-OFL.txt"]
"memcommit.eval" = ["fixtures/*.json"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
