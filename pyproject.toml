[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memcommit"
version = "0.0.1"
description = "A git-like memory store CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # CLI adapters still rely on Typer's Click-backed context and test-runner APIs.
  "click>=8.1,<8.2",
  "typer>=0.12,<0.13",
  "rich>=13.0",
  "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
mem = "memcommit.adapters.console.entrypoint:app"
mem-mcp = "memcommit.adapters.interfaces.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["memcommit*"]

[tool.setuptools.package-data]
"memcommit.application.evaluation" = ["fixtures/*.json"]
"memcommit.study_scenarios.legacy" = ["data/en/*", "data/ko/*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
